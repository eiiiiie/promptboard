<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3e9d5">
<meta name="robots" content="noindex, nofollow">
<title>프롬프트 보드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f3e9d5'/%3E%3Cpath d='M6 10h20M6 16h20M6 22h13' stroke='%23b23b2b' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#f3e9d5; --rule:#e6d9bf; --card:#fbf7ee; --card-line:#e2d5ba; --text:#3b342c; --sub:#8c806d;
  --red:#b23b2b; --btn-line:#cdbfa3; --btn-bg:#fbf7ee; --hover:#f1e7d3; --hit:#ffe08a; --ok:#4f8a4b;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper)}
body{margin:0;color:var(--text);font:15px/1.6 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  background:var(--paper) repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);min-height:100vh}
button{font:inherit;color:inherit;background:var(--btn-bg);border:1px solid var(--btn-line);border-radius:3px;padding:3px 12px;cursor:pointer}
button:hover{background:var(--hover)}
input,textarea{font:inherit;color:inherit}

.mast{max-width:1100px;margin:0 auto;padding:26px 38px 10px}
.mast h1{margin:0;font:italic 700 30px/1.3 Georgia,"Malgun Gothic",serif;color:var(--red);display:inline-block}
.mast h1 u{text-decoration-thickness:2px;text-underline-offset:5px}
.mast h1 b{color:var(--text)}
.mast .desc{margin:6px 0 0;color:var(--sub);font-size:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
.mast .desc span:first-child{flex:1;min-width:240px}
.link{border:none;background:none;color:var(--red);padding:0 2px}
.link:hover{background:none;text-decoration:underline}
#status{font-size:13px;color:var(--sub)}
#status.bad{color:var(--red)}

#head{position:sticky;top:0;z-index:20;background:var(--paper);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tabrow{margin:0 auto;display:flex;gap:6px;align-items:center;padding:8px 38px 0}
#tabs{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding-bottom:6px;scrollbar-width:auto;scrollbar-color:#c9b993 transparent;touch-action:pan-x}
#tabs::-webkit-scrollbar{height:12px}
#tabs::-webkit-scrollbar-thumb{background:#d3c4a2;border-radius:6px;border:3px solid var(--paper)}
#tabs::-webkit-scrollbar-thumb:hover{background:#bfae86}
.tab{flex:none;display:flex;align-items:center;gap:8px;max-width:640px;padding:8px 10px 8px 18px;border:1px solid var(--card-line);background:var(--card);color:#6f6352;cursor:pointer;user-select:none;white-space:nowrap}
.tab .name{overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--text);border-color:#bba984;box-shadow:inset 0 -3px 0 var(--red);background:#fffdf7}
.tab.drop{outline:2px dashed var(--red);outline-offset:-3px}
.tab.found .name{background:var(--hit)}
.tab .x{border:none;background:none;padding:0 4px;color:var(--sub)}
.tab .x:hover{color:var(--red)}
.tab input{width:260px;border:1px solid var(--red);padding:0 4px;background:#fff}
#addTab{flex:none;align-self:flex-start;padding:8px 12px}

#searchbar{display:none;max-width:1100px;margin:0 auto;padding:6px 38px 8px;gap:6px;align-items:center;flex-wrap:wrap}
#searchbar.on{display:flex}
#q{flex:1;min-width:0;padding:4px 8px;border:1px solid var(--btn-line);background:#fffdf7;border-radius:3px}
#qcount{color:var(--sub);white-space:nowrap;font-size:13px}
#qsnip{flex-basis:100%;font-size:13px;color:var(--sub);display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#qsnip.on{display:block}
#qsnip mark{background:var(--hit);color:inherit}

main{max-width:1100px;margin:0 auto;padding:24px 38px 120px}
#cards{display:flex;flex-direction:column;gap:22px;max-width:900px}
.card{background:var(--card);border:1px solid var(--card-line);box-shadow:3px 3px 0 rgba(120,100,60,.12);padding:14px 26px 18px}
.card.hit{outline:3px solid var(--hit)}
.card.dragover{outline:2px dashed var(--red)}
.bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--card-line);padding-bottom:10px;margin:0 -8px}
.grip{cursor:grab;color:var(--sub);border:1px solid transparent;background:none;padding:0 6px;touch-action:none;font-size:17px}
.grip:hover{border-color:var(--btn-line)}
.label{color:var(--red);font-weight:700;font-size:14px;margin-right:auto;white-space:nowrap}
.tog{border-style:dashed;color:var(--sub);font-size:14px}
.tog.on{border-style:solid;color:var(--text);background:#efe4cc}
.copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
.more{padding:3px 8px}
.title{display:block;width:100%;margin-top:10px;border:none;border-bottom:1px solid var(--card-line);background:transparent;padding:4px 2px;font:italic 700 18px Georgia,"Malgun Gothic",serif;color:var(--text)}
.title:focus{outline:none;border-bottom-color:var(--red)}
.text{display:block;width:100%;min-height:96px;resize:none;overflow:hidden;border:none;border-bottom:1px solid var(--card-line);padding:12px 4px 10px;background:transparent;font-size:17px;line-height:1.7}
.text:focus,.paths:focus{outline:none;border-bottom-color:var(--red)}
.text::placeholder,.title::placeholder,.paths::placeholder{color:#b4a890;font-weight:400}
.paths{display:block;width:100%;min-height:44px;resize:vertical;border:1px dashed var(--btn-line);padding:6px 8px;background:#fffdf7;margin-top:12px;font:13px Consolas,monospace}
.imgzone{margin-top:12px;border:1px dashed var(--btn-line);padding:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fffdf7}
.imgzone .hint{color:var(--sub);font-size:13px}
.im{position:relative;height:110px;border:1px solid var(--card-line);background:#fff}
.im img{height:100%;display:block;cursor:zoom-in;min-width:60px}
.im .ib{position:absolute;top:4px;display:none;padding:0 6px;font-size:12px;background:rgba(40,32,24,.75);color:#fff;border:none}
.im:hover .ib,.im:focus-within .ib{display:block}
.im .ib.del{right:4px}.im .ib.cp{left:4px}
#addCard{display:block;margin-top:24px;width:164px;padding:12px;border:1px dashed #9f927b;background:transparent;color:#6f6352;font-weight:700}
#addCard:hover{background:var(--hover)}
#empty{color:var(--sub);padding:20px 0 0}
.dragging{opacity:.35}
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;opacity:.92;box-shadow:0 10px 28px rgba(60,40,10,.3);margin:0}

.menu{position:fixed;z-index:60;background:var(--card);border:1px solid var(--btn-line);box-shadow:4px 4px 0 rgba(120,100,60,.15);padding:4px;min-width:200px;max-height:70vh;overflow:auto}
.menu button{display:block;width:100%;text-align:left;border:none;padding:7px 12px;background:none}
.menu button:hover{background:var(--hover)}
.menu .sep{height:1px;background:var(--card-line);margin:4px}
.menu .lbl{font-size:12px;color:var(--sub);padding:4px 12px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;background:#3b342c;color:#fbf7ee;padding:9px 16px;display:none;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw;font-size:14px}
#toast.on{display:flex}
#toast button{background:none;border-color:#8c806d;color:#fbf7ee}
#viewer{position:fixed;inset:0;z-index:90;background:rgba(20,16,10,.88);display:none;align-items:center;justify-content:center;cursor:zoom-out}
#viewer.on{display:flex}
#viewer img{max-width:96vw;max-height:94vh}
#drop{position:fixed;inset:0;z-index:70;border:4px dashed var(--red);background:rgba(243,233,213,.6);display:none;pointer-events:none;align-items:center;justify-content:center;font-size:20px;color:var(--red)}
#drop.on{display:flex}

dialog{border:1px solid var(--btn-line);background:var(--card);color:var(--text);padding:0;width:min(600px,94vw);max-height:90vh;box-shadow:6px 6px 0 rgba(120,100,60,.18)}
dialog::backdrop{background:rgba(40,30,10,.35)}
.dlg{padding:20px 24px;overflow:auto;max-height:86vh}
.dlg h3{margin:18px 0 6px;font:italic 700 17px Georgia,"Malgun Gothic",serif;color:var(--red)}
.dlg h3:first-child{margin-top:0}
.dlg p,.dlg li{margin:4px 0;color:var(--sub);font-size:13px}
.dlg ol{padding-left:20px;margin:6px 0}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.dlg input[type=text],.dlg input[type=password]{flex:1;min-width:0;padding:4px 8px;border:1px solid var(--btn-line);background:#fffdf7}
#qr{background:#fff;padding:10px;display:inline-block}
#qr:empty{display:none}
.trash-item{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--card-line);padding:6px 0;font-size:13px}
.trash-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#setup{position:fixed;inset:0;z-index:95;background:var(--paper);display:none;padding:40px 24px;font-size:16px}
#setup.on{display:block}
#setup h1{font:italic 700 28px Georgia,"Malgun Gothic",serif;color:var(--red)}
.mobile-only{display:none}
@media (max-width:700px){
  .mast{padding:16px 14px 6px}.mast h1{font-size:24px}.mast .desc span:first-child{display:none}
  .tabrow{padding:6px 10px 0}#searchbar{padding:6px 10px 8px}
  .tab{max-width:200px;padding:9px 8px 9px 12px}
  main{padding:14px 10px 120px}
  .card{padding:10px 14px 14px}
  .bar{margin:0}
  .label{display:none}
  .im{height:90px}.im .ib{display:block}
  .pc-only{display:none!important}.mobile-only{display:inline-block}
  .grip{font-size:22px;padding:2px 8px}
  .bar button{padding:4px 8px;font-size:13px}.bar{flex-wrap:nowrap;gap:4px}
  #addCard{width:100%}
}
</style>
</head>
<body>
<div class="mast">
  <h1><u>프롬프트 보드</u><b>.</b></h1>
  <div class="desc">
    <span>작업 중 떠오른 프롬프트를 탭과 칸으로 나눠 쌓아두고, 끝나면 칸의 [복사]를 눌러 붙여넣으세요.</span>
    <span id="status">불러오는 중</span>
    <button class="link" id="searchBtn" title="찾기 (Ctrl+F)">[찾기]</button>
    <button class="link" id="menuBtn">[메뉴]</button>
  </div>
</div>
<div id="head">
  <div class="tabrow">
    <div id="tabs" role="tablist" aria-label="탭"></div>
    <button id="addTab" title="새 탭">+</button>
  </div>
  <div id="searchbar">
    <input id="q" placeholder="모든 탭에서 찾기" autocomplete="off">
    <span id="qcount"></span>
    <button id="qprev">이전</button><button id="qnext">다음</button><button id="qclose">닫기</button>
    <div id="qsnip"></div>
  </div>
</div>
<main>
  <div id="cards"></div>
  <div id="empty" hidden>이 탭에는 칸이 없어요. 아래 '+ 새 칸'으로 만드세요.</div>
  <button id="addCard">+ 새 칸</button>
</main>
<input type="file" id="filePick" accept="image/*" multiple hidden>
<div id="toast"><span id="toastMsg"></span><button id="toastBtn" hidden></button></div>
<div id="viewer"><img alt=""></div>
<div id="drop">여기에 놓으면 이미지가 들어가요</div>
<div id="setup">
  <h1>프롬프트 보드</h1>
  <p>처음 한 번만 연결하면 돼요.</p>
  <p>PC 의 프롬프트 보드에서 [메뉴]를 눌러 나오는 QR 코드를 이 폰의 카메라로 찍어 주세요.</p>
</div>
<dialog id="dlg"><div class="dlg">
  <h3>폰 연동</h3>
  <div id="syncBox"><p>불러오는 중</p></div>
  <h3>휴지통</h3>
  <p>지운 칸과 탭은 30일 동안 여기 있다가 지워져요.</p>
  <div id="trashList"></div>
  <div class="row"><button id="emptyTrash">휴지통 비우기</button></div>
  <div class="pc-only" id="pcSection">
    <h3>이 PC</h3>
    <p id="storageInfo"></p>
    <div class="row"><button id="openFolder">저장 폴더 열기</button>
      <label><input type="checkbox" id="autostart"> 컴퓨터를 켜면 자동으로 켜기</label></div>
    <div class="row"><button id="quitApp">프로그램 완전히 끄기</button></div>
  </div>
  <div class="row" style="justify-content:flex-end"><button id="dlgClose">닫기</button></div>
</div></dialog>
<script>
"use strict";
const IS_PC = ["127.0.0.1", "localhost"].includes(location.hostname);
const $ = s => document.querySelector(s);
const tabsEl = $("#tabs"), cardsEl = $("#cards");
let data = null, rev = 0, active = load("pb_active", "");
let outbox = load("pb_outbox", []), inFlight = 0, flushTimer = null, backoff = 1000;
let selCard = null; // 마지막으로 누른 칸 (붙여넣기 대상)

function load(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } }
function keep(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
function uid(){ return "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function el(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs)){
    if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(k === "class") e.className = v;
    else if(v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for(const c of kids) if(c != null) e.append(c);
  return e;
}

// ---------- 변경 규칙 (PC 프로그램의 Store._apply 와 같은 규칙) ----------
function applyOps(d, ops){
  d.trash = d.trash || [];
  const tabs = d.tabs;
  const tab = id => tabs.find(t => t.id === id);
  const find = id => { for(const t of tabs){ const i = t.cards.findIndex(c => c.id === id); if(i >= 0) return [t, i, t.cards[i]]; } return [null, -1, null]; };
  const at = (i, n) => Number.isInteger(i) ? Math.max(0, Math.min(i, n)) : n;
  for(const o of ops){
    if(o.op === "tab_put"){ const c = tab(o.tab.id); if(c) c.name = o.tab.name || c.name; else tabs.splice(at(o.index, tabs.length), 0, {id: o.tab.id, name: o.tab.name || "작업", cards: []}); }
    else if(o.op === "tab_move"){ const c = tab(o.id); if(c){ tabs.splice(tabs.indexOf(c), 1); tabs.splice(at(o.index, tabs.length), 0, c); } }
    else if(o.op === "tab_del"){ const c = tab(o.id); if(c){ const i = tabs.indexOf(c); tabs.splice(i, 1); d.trash.unshift({id: o.trashId || uid(), kind: "tab", tab: c, index: i, at: Date.now()}); } }
    else if(o.op === "card_put"){
      const [t, i, c] = find(o.card.id);
      if(c) t.cards[i] = {...c, ...o.card};
      else { const t2 = tab(o.tab) || tabs[0]; t2.cards.splice(at(o.index, t2.cards.length), 0, {title: "", text: "", images: [], paths: [], height: 100, showTitle: false, showImages: false, showPaths: false, ...o.card}); }
    }
    else if(o.op === "card_move"){ const [t, i, c] = find(o.id), dest = tab(o.tab); if(c && dest){ t.cards.splice(i, 1); dest.cards.splice(at(o.index, dest.cards.length), 0, c); } }
    else if(o.op === "card_del"){ const [t, i, c] = find(o.id); if(c){ t.cards.splice(i, 1); d.trash.unshift({id: o.trashId || uid(), kind: "card", card: c, tabId: t.id, tabName: t.name, index: i, at: Date.now()}); } }
    else if(o.op === "restore"){
      const e = d.trash.find(x => x.id === o.id); if(!e) continue;
      d.trash.splice(d.trash.indexOf(e), 1);
      if(e.kind === "tab"){ const t = clone(e.tab); if(tab(t.id)) t.id = uid(); tabs.splice(Math.min(e.index ?? tabs.length, tabs.length), 0, t); }
      else { const c = clone(e.card); if(find(c.id)[2]) c.id = uid(); const t = tab(e.tabId) || tab(o.tab) || tabs[0]; t.cards.splice(Math.min(e.index ?? t.cards.length, t.cards.length), 0, c); }
    }
    else if(o.op === "trash_empty"){ d.trash = []; }
  }
  if(!tabs.length) tabs.push({id: uid(), name: "작업 1", cards: []});
  return d;
}

// ---------- 저장 통로: PC 는 이 PC 의 프로그램, 폰은 GitHub 비공개 저장소 ----------
const local = {
  async req(path, body, type){
    const opt = {headers: {"X-PB": "1"}};
    if(body !== undefined){
      opt.method = "POST";
      if(type){ opt.headers["Content-Type"] = type; opt.body = body; }
      else { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
    }
    const r = await fetch(path, opt);
    if(!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
    return r.json();
  },
  send(ops){ return this.req("/api/ops", ops); },
  async upload(blob){ return (await this.req("/api/image", blob, blob.type)).name; },
  imgSrc(name){ return "/img/" + name; },
  async next(){ // 바뀐 내용이 생길 때까지 기다린다
    const j = await this.req("/api/data?since=" + rev);
    if(!j.data) return null;
    rev = j.rev; return j.data;
  },
};

const cloud = {
  repo: load("pb_repo", ""), token: load("pb_token", ""),
  remote: null, sha: null, etag: null, oldShas: new Set(), imgCache: new Map(),
  async gh(method, path, {body, headers = {}} = {}){
    const r = await fetch(`https://api.github.com/repos/${this.repo}${path}`, {method, cache: "no-store",
      headers: {Authorization: "Bearer " + this.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...headers,
        ...(body ? {"Content-Type": "application/json"} : {})},
      body: body ? JSON.stringify(body) : undefined});
    if(r.status === 401) throw new Error("연결 열쇠(토큰)가 맞지 않아요. PC 메뉴의 QR 을 다시 찍어 주세요");
    return r;
  },
  async fetch(){
    const r = await this.gh("GET", "/contents/data.json", {headers: this.etag ? {"If-None-Match": this.etag} : {}});
    if(r.status === 304) return false;
    if(r.status === 404){ this.remote = {tabs: [{id: uid(), name: "작업 1", cards: []}], trash: []}; this.sha = null; this.etag = null; return true; }
    if(!r.ok) throw new Error("저장소를 읽지 못했어요 (" + r.status + ")");
    const j = await r.json();
    if(this.oldShas.has(j.sha)) return false; // 방금 덮어쓴 옛 내용이 늦게 보이는 경우
    const text = j.encoding === "base64" ? b64ToText(j.content)
      : await (await this.gh("GET", "/git/blobs/" + j.sha, {headers: {Accept: "application/vnd.github.raw"}})).text();
    this.remote = JSON.parse(text); this.sha = j.sha; this.etag = r.headers.get("ETag");
    return true;
  },
  async send(ops){
    for(let n = 0; n < 6; n++){
      if(!this.remote) await this.fetch();
      const cand = applyOps(clone(this.remote), ops);
      const body = {message: "PromptBoard (폰)", content: textToB64(JSON.stringify(cand, null, 0))};
      if(this.sha) body.sha = this.sha;
      const r = await this.gh("PUT", "/contents/data.json", {body});
      if(r.status === 409 || r.status === 422){ this.etag = null; await this.fetch(); continue; }
      if(!r.ok) throw new Error("저장소에 쓰지 못했어요 (" + r.status + ")");
      const j = await r.json();
      if(this.sha) this.oldShas.add(this.sha);
      this.remote = cand; this.sha = j.content.sha; this.etag = null;
      return;
    }
    throw new Error("다른 기기와 동시에 고치는 중이라 다시 시도할게요");
  },
  async upload(blob){
    const buf = new Uint8Array(await blob.arrayBuffer());
    const hash = [...new Uint8Array(await crypto.subtle.digest("SHA-256", buf))].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 32);
    const name = hash + "." + ({"image/jpeg": "jpg", "image/png": "png", "image/gif": "gif", "image/webp": "webp", "image/bmp": "bmp"}[blob.type] || "jpg");
    const r = await this.gh("PUT", "/contents/images/" + name, {body: {message: "image", content: bytesToB64(buf)}});
    if(!r.ok && r.status !== 422) throw new Error("이미지를 올리지 못했어요 (" + r.status + ")");
    this.imgCache.set(name, URL.createObjectURL(blob));
    return "img:" + name;
  },
  imgSrc(name, img){
    if(this.imgCache.has(name)) return this.imgCache.get(name);
    this.gh("GET", "/contents/images/" + name, {headers: {Accept: "application/vnd.github.raw"}})
      .then(r => r.ok ? r.blob() : null).then(b => { if(!b) return; const u = URL.createObjectURL(b); this.imgCache.set(name, u); if(img) img.src = u; })
      .catch(() => {});
    return "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
  },
  async next(){
    for(;;){
      if(await this.fetch()) return clone(this.remote);
      await sleep(document.hidden ? 30000 : 4000);
    }
  },
};
function b64ToText(b64){ const bin = atob(b64.replace(/\s/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function bytesToB64(bytes){ let s = ""; for(let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(s); }
function textToB64(t){ return bytesToB64(new TextEncoder().encode(t)); }

const store = IS_PC ? local : cloud;

// ---------- 모델 ----------
const tabOf = id => data.tabs.find(t => t.id === id);
function findCard(id){
  for(const t of data.tabs){ const i = t.cards.findIndex(c => c.id === id); if(i >= 0) return [t, i, t.cards[i]]; }
  return [null, -1, null];
}
function curTab(){ return tabOf(active) || data.tabs[0]; }

// 바뀐 내용은 먼저 이 기기에 보관하고(outbox), 보낸 뒤 지운다
function op(o, delay = 0){
  if(o.op === "card_put"){
    for(let i = outbox.length - 1; i >= inFlight; i--){
      const p = outbox[i];
      if(p.op === "card_put" && p.card.id === o.card.id){ p.card = {...p.card, ...o.card}; keep("pb_outbox", outbox); return schedule(delay); }
    }
  }
  outbox.push(o); keep("pb_outbox", outbox); schedule(delay);
}
function schedule(delay){
  setStatus("저장 중");
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, IS_PC ? delay : Math.max(delay, 1200));
}
async function flush(){
  if(inFlight || !outbox.length) return;
  inFlight = outbox.length;
  try{
    await store.send(outbox.slice(0, inFlight));
    outbox.splice(0, inFlight); keep("pb_outbox", outbox); backoff = 1000;
    inFlight = 0;
    if(outbox.length) flush(); else setStatus("저장됨");
  }catch(e){
    inFlight = 0;
    setStatus("연결 안 됨. 내용은 이 기기에 보관 중이고 다시 보내는 중" + (e.message ? " (" + e.message + ")" : ""), true);
    flushTimer = setTimeout(flush, backoff); backoff = Math.min(backoff * 2, 30000);
  }
}
function setStatus(t, bad){ const s = $("#status"); s.textContent = t; s.classList.toggle("bad", !!bad); }

async function poll(){
  for(;;){
    try{
      const d = await store.next();
      if(d){
        const firstLoad = !data;
        data = d; data.trash = data.trash || [];
        if(firstLoad && !tabOf(active)) active = data.activeTab || data.tabs[0].id;
        applyOps(data, outbox); // 아직 못 보낸 변경을 다시 얹는다
        render();
        if(firstLoad) tabsEl.querySelector(".tab.active")?.scrollIntoView({inline: "nearest", block: "nearest"});
        if(firstLoad && outbox.length) flush();
      }
      if(!outbox.length) setStatus("저장됨");
    }catch(e){
      setStatus((data ? "연결 안 됨. 다시 연결하는 중" : IS_PC ? "PC 프로그램에 연결하지 못했어요" : "저장소에 연결하지 못했어요") + (e.message ? " (" + e.message + ")" : ""), true);
      await sleep(IS_PC ? 3000 : 8000);
    }
  }
}

// ---------- 그리기 ----------
function render(){ renderTabs(); renderCards(); if(search.on) search.run(false); }

function renderTabs(){
  if(tabsEl.querySelector("input")) return; // 이름 바꾸는 중
  const sl = tabsEl.scrollLeft;
  tabsEl.replaceChildren(...data.tabs.map(t => el("div", {class: "tab" + (t.id === curTab().id ? " active" : ""), "data-id": t.id, title: t.name + "\n(두 번 눌러 이름 바꾸기, 끌어서 순서 바꾸기)", role: "tab"},
    el("span", {class: "name"}, t.name),
    el("button", {class: "x", title: "탭 닫기", onclick: e => { e.stopPropagation(); delTab(t.id); }}, "×"))));
  tabsEl.scrollLeft = sl;
}

function renderCards(){
  const t = curTab();
  const y = scrollY;
  const old = new Map([...cardsEl.children].map(e => [e.dataset.id, e]));
  const list = t.cards.map((c, i) => { const e = old.get(c.id) || makeCard(c); updateCard(e, c, i); return e; });
  // 순서가 같으면 칸을 다시 만들지 않는다 (입력 중인 칸의 커서와 화면 위치가 그대로)
  const same = list.length === cardsEl.children.length && list.every((e, i) => cardsEl.children[i] === e);
  if(!same) cardsEl.replaceChildren(...list);
  // 칸이 화면에 붙은 뒤에야 글 높이를 잴 수 있다 (붙기 전에 재면 0 이 나와 글이 가려진다)
  for(const e of list) fit(e.querySelector(".text"));
  $("#empty").hidden = t.cards.length > 0;
  if(scrollY !== y) scrollTo(0, y);
}

function makeCard(c){
  const e = el("div", {class: "card", "data-id": c.id});
  const id = () => e.dataset.id;
  const title = el("input", {class: "title", placeholder: "제목", oninput: () => edit(id(), {title: title.value}, 600)});
  const text = el("textarea", {class: "text", placeholder: "프롬프트를 적으세요", oninput: () => { grow(text); edit(id(), {text: text.value}, 600); }});
  const paths = el("textarea", {class: "paths", placeholder: "파일 경로 (한 줄에 하나)", oninput: () => edit(id(), {paths: paths.value.split("\n")}, 600)});
  paths.addEventListener("blur", () => edit(id(), {paths: paths.value.split("\n").map(s => s.trim()).filter(Boolean)}, 0));
  const tog = (label, key) => el("button", {class: "tog", "data-key": key, onclick: () => { const [, , c2] = findCard(id()); edit(id(), {[key]: !shown(c2, key)}, 0); renderCards(); }}, label);
  const copyBtn = el("button", {class: "copy", title: "글과 이미지를 모두 복사", onclick: () => copyCard(id(), copyBtn)}, "복사");
  e.append(
    el("div", {class: "bar"},
      el("button", {class: "grip", title: "끌어서 순서 바꾸기, 위의 탭에 놓으면 그 탭으로 옮기기"}, "⠿"),
      el("span", {class: "label"}),
      tog("제목", "showTitle"), tog("이미지", "showImages"), tog("경로", "showPaths"),
      copyBtn,
      el("button", {onclick: () => delCard(id())}, "삭제"),
      el("button", {class: "more", title: "더 보기", onclick: ev => cardMenu(id(), ev.currentTarget)}, "⋯")),
    title, text,
    el("div", {class: "imgzone"}),
    paths);
  e.addEventListener("focusin", () => selCard = id());
  e.addEventListener("pointerdown", () => selCard = id());
  e.addEventListener("dragover", ev => { if(hasFiles(ev)){ ev.preventDefault(); ev.stopPropagation(); e.classList.add("dragover"); $("#drop").classList.remove("on"); } });
  e.addEventListener("dragleave", () => e.classList.remove("dragover"));
  e.addEventListener("drop", ev => { e.classList.remove("dragover"); if(hasFiles(ev)){ ev.preventDefault(); ev.stopPropagation(); dropDepth = 0; $("#drop").classList.remove("on"); addImages(id(), ev.dataTransfer.files); } });
  return e;
}

function updateCard(e, c, i){
  const set = (sel, v) => { const x = e.querySelector(sel); if(document.activeElement !== x && x.value !== v){ x.value = v; if(x.classList.contains("text")) grow(x); } };
  e.querySelector(".label").textContent = "칸 " + (i + 1);
  const showTitle = shown(c, "showTitle"), showImg = shown(c, "showImages"), showPaths = shown(c, "showPaths");
  for(const b of e.querySelectorAll(".tog")) b.classList.toggle("on", {showTitle, showImages: showImg, showPaths}[b.dataset.key]);
  e.querySelector(".title").hidden = !showTitle;
  e.querySelector(".paths").hidden = !showPaths;
  e.querySelector(".imgzone").hidden = !showImg;
  set(".title", c.title || "");
  set(".text", c.text || "");
  set(".paths", (c.paths || []).join("\n"));
  const key = (c.images || []).join("|");
  if(e.dataset.imgs !== key){
    e.dataset.imgs = key;
    e.querySelector(".imgzone").replaceChildren(...(c.images || []).map(im => {
      const name = im.replace(/^img:/, "");
      const img = el("img", {loading: "lazy", alt: "", onclick: () => view(img.src)});
      img.src = store.imgSrc(name, img);
      return el("div", {class: "im"}, img,
        IS_PC ? el("button", {class: "ib cp", title: "이 이미지만 복사", onclick: ev => copyImage(img.src, ev.currentTarget)}, "복사") : null,
        el("button", {class: "ib del", title: "이미지 빼기", onclick: () => removeImage(e.dataset.id, im)}, "×"));
    }),
    el("span", {class: "hint pc-only"}, "이미지를 여기에 끌어다 놓거나, 이 칸을 누른 뒤 Ctrl+V"),
    el("button", {onclick: () => pickImages(e.dataset.id)}, IS_PC ? "파일에서 넣기" : "+ 사진 넣기"));
  }
}
function shown(c, key){
  const has = {showTitle: !!c.title, showImages: !!(c.images || []).length, showPaths: !!(c.paths || []).length}[key];
  return typeof c[key] === "boolean" ? c[key] : has;
}
// 글 길이에 맞게 칸 높이를 바꾼다. 잠깐 줄어드는 동안 화면이 위로 튀지 않게 위치를 되돌린다
function fit(t){ if(t.isConnected && Math.abs(t.scrollHeight + 2 - t.offsetHeight) > 1) grow(t); }
function grow(t){
  const y = scrollY;
  t.style.height = "auto";
  t.style.height = Math.max(96, t.scrollHeight + 2) + "px";
  if(scrollY !== y) scrollTo(0, y);
}

// ---------- 칸 ----------
function edit(id, fields, delay){
  const [, , c] = findCard(id); if(!c) return;
  Object.assign(c, fields);
  op({op: "card_put", card: {id, ...fields}}, delay);
}
function addCard(fields = {}){
  const t = curTab();
  const c = {id: uid(), title: "", text: "", images: [], paths: [], height: 100, showTitle: false, showImages: false, showPaths: false, ...fields};
  t.cards.push(c);
  op({op: "card_put", tab: t.id, card: c});
  renderCards();
  const e = cardsEl.querySelector(`[data-id="${c.id}"]`);
  e.scrollIntoView({block: "nearest"});
  if(!fields.images) e.querySelector(".text").focus({preventScroll: true});
  selCard = c.id;
  return c.id;
}
function delCard(id){
  const [t, i, c] = findCard(id); if(!t) return;
  const trashId = uid();
  t.cards.splice(i, 1);
  data.trash.unshift({id: trashId, kind: "card", card: c, tabId: t.id, tabName: t.name, index: i, at: Date.now()});
  op({op: "card_del", id, trashId});
  renderCards();
  toast("칸을 지웠어요", "되돌리기", () => { op({op: "restore", id: trashId}); applyOps(data, [{op: "restore", id: trashId}]); renderCards(); });
}
function cardMenu(id, anchor){
  const [, , c] = findCard(id); if(!c) return;
  popMenu(anchor, [
    ["글만 복사", () => copyText(cardText(c)).then(() => toast("글을 복사했어요"), e => toast(e.message))],
    "sep", "lbl:다른 탭으로 옮기기",
    ...data.tabs.filter(t => t.id !== curTab().id).map(t => [t.name, () => moveCard(id, t.id)]),
  ]);
}
function moveCard(id, tabId, index){
  const [t, i, c] = findCard(id), d = tabOf(tabId); if(!c || !d) return;
  t.cards.splice(i, 1);
  const at = index ?? d.cards.length;
  d.cards.splice(at, 0, c);
  op({op: "card_move", id, tab: tabId, index: at});
  renderCards();
  if(t !== d) toast(`'${d.name}' 탭으로 옮겼어요`, "가 보기", () => selectTab(d.id));
}
function cardText(c){
  const paths = (c.paths || []).filter(Boolean);
  return [c.text || "", paths.join("\n")].filter(s => s.trim()).join("\n\n");
}

// ---------- 복사 ----------
async function copyCard(id, btn){
  const [, , c] = findCard(id); if(!c) return;
  const text = cardText(c), n = (c.images || []).length;
  if(!text.trim() && !n) return toast("복사할 내용이 없어요");
  try{
    if(IS_PC){
      const r = await local.req("/api/copy", {text, images: c.images});
      flash(btn);
      toast(r.combo ? `글과 이미지 ${n}장을 복사했어요. 붙여넣을 곳에서 Ctrl+V 한 번이면 모두 들어가요 (1분 안에)`
        : n ? `이미지 ${n}장을 복사했어요` : "복사했어요");
    } else {
      await copyText(text);
      flash(btn);
      toast(n ? "글을 복사했어요. 이미지는 눌러서 연 뒤 길게 눌러 복사하세요" : "복사했어요");
    }
  }catch(e){ toast("복사하지 못했어요: " + e.message); }
}
function flash(btn){ btn.classList.add("done"); btn.textContent = "복사됨"; setTimeout(() => { btn.classList.remove("done"); btn.textContent = "복사"; }, 1500); }
async function copyText(t){
  if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(t); }
  const ta = el("textarea", {style: "position:fixed;opacity:0;top:0"}); ta.value = t; document.body.append(ta);
  ta.select(); const ok = document.execCommand("copy"); ta.remove();
  if(!ok) throw new Error("이 브라우저에서는 복사가 막혀 있어요");
}
async function copyImage(src, btn){
  try{
    let blob = await (await fetch(src)).blob();
    if(blob.type !== "image/png") blob = await toPng(blob);
    await navigator.clipboard.write([new ClipboardItem({"image/png": blob})]);
    btn.textContent = "복사됨"; setTimeout(() => btn.textContent = "복사", 1200);
  }catch(e){ toast("이미지를 복사하지 못했어요: " + e.message); }
}
async function toPng(blob){
  const bmp = await createImageBitmap(blob);
  const cv = el("canvas"); cv.width = bmp.width; cv.height = bmp.height; cv.getContext("2d").drawImage(bmp, 0, 0);
  return new Promise(r => cv.toBlob(r, "image/png"));
}

// ---------- 이미지 ----------
const OK_TYPES = ["image/png", "image/jpeg", "image/gif", "image/webp", "image/bmp"];
async function normalize(f){
  if(OK_TYPES.includes(f.type) && (IS_PC || f.size < 4e6)) return f;
  const bmp = await createImageBitmap(f); // HEIC 나 아주 큰 사진은 JPG 로 바꾸고 줄인다
  const k = Math.min(1, 2560 / Math.max(bmp.width, bmp.height));
  const cv = el("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  return new Promise(r => cv.toBlob(r, "image/jpeg", .9));
}
async function addImages(cardId, files){
  files = [...files].filter(f => f.type.startsWith("image/") || /\.(heic|heif|png|jpe?g|gif|webp|bmp)$/i.test(f.name));
  if(!files.length) return toast("이미지 파일만 넣을 수 있어요. 파일 경로는 칸의 [경로]를 눌러 붙여넣어 주세요");
  if(!cardId || !findCard(cardId)[2]) cardId = addCard({images: [], showImages: true});
  toast(`이미지 ${files.length}장 올리는 중`);
  let done = 0;
  for(const f of files){
    try{
      const name = await store.upload(await normalize(f));
      const [, , c] = findCard(cardId); if(!c) break;
      if(!c.images.includes(name)) edit(cardId, {images: [...c.images, name], showImages: true}, 0);
      done++;
      renderCards();
    }catch(e){ toast("이미지를 올리지 못했어요: " + e.message); }
  }
  if(done) toast(`이미지 ${done}장을 넣었어요`);
}
function removeImage(cardId, im){
  const [, , c] = findCard(cardId); if(!c) return;
  const before = c.images.slice();
  edit(cardId, {images: c.images.filter(x => x !== im)}, 0);
  renderCards();
  toast("이미지를 뺐어요", "되돌리기", () => { edit(cardId, {images: before}, 0); renderCards(); });
}
let pickTarget = null;
function pickImages(cardId){ pickTarget = cardId; $("#filePick").click(); }
$("#filePick").addEventListener("change", e => { addImages(pickTarget, e.target.files); e.target.value = ""; });
function view(src){ $("#viewer img").src = src; $("#viewer").classList.add("on"); }
$("#viewer").onclick = () => $("#viewer").classList.remove("on");

document.addEventListener("paste", e => {
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith("image/"));
  if(!files.length) return;
  e.preventDefault();
  const inCard = document.activeElement?.closest?.(".card")?.dataset.id;
  addImages(inCard || selCard, files);
});
const hasFiles = ev => [...(ev.dataTransfer?.types || [])].includes("Files");
let dropDepth = 0;
document.addEventListener("dragenter", e => { if(hasFiles(e)){ dropDepth++; $("#drop").classList.add("on"); } });
document.addEventListener("dragleave", e => { if(hasFiles(e) && --dropDepth <= 0){ dropDepth = 0; $("#drop").classList.remove("on"); } });
document.addEventListener("dragover", e => { if(hasFiles(e)) e.preventDefault(); });
document.addEventListener("drop", e => { if(!hasFiles(e)) return; e.preventDefault(); dropDepth = 0; $("#drop").classList.remove("on"); addImages(null, e.dataTransfer.files); });

// ---------- 탭 ----------
function selectTab(id){
  active = id; keep("pb_active", id);
  renderTabs(); renderCards();
  if(scrollY > $("#head").offsetTop) scrollTo(0, $("#head").offsetTop);
  tabsEl.querySelector(`[data-id="${id}"]`)?.scrollIntoView({inline: "nearest", block: "nearest"});
}
function addTab(){
  const t = {id: uid(), name: "작업 " + (data.tabs.length + 1), cards: []};
  const at = data.tabs.indexOf(curTab()) + 1;
  data.tabs.splice(at, 0, t);
  op({op: "tab_put", tab: {id: t.id, name: t.name}, index: at});
  selectTab(t.id); renameTab(t.id);
}
function delTab(id){
  if(data.tabs.length <= 1) return toast("탭이 최소 1개는 있어야 해요");
  const t = tabOf(id), i = data.tabs.indexOf(t), trashId = uid();
  data.tabs.splice(i, 1);
  data.trash.unshift({id: trashId, kind: "tab", tab: t, index: i, at: Date.now()});
  op({op: "tab_del", id, trashId});
  if(active === id) active = (data.tabs[i] || data.tabs[i - 1]).id;
  render();
  toast(`'${t.name}' 탭을 닫았어요` + (t.cards.length ? ` (칸 ${t.cards.length}개)` : ""), "되돌리기", () => { op({op: "restore", id: trashId}); applyOps(data, [{op: "restore", id: trashId}]); render(); });
}
function renameTab(id){
  const t = tabOf(id), tabEl = tabsEl.querySelector(`[data-id="${id}"]`); if(!tabEl) return;
  const inp = el("input", {value: t.name});
  let done = false;
  const finish = ok => {
    if(done) return; done = true;
    const v = inp.value.trim();
    if(ok && v && v !== t.name){ t.name = v; op({op: "tab_put", tab: {id, name: v}}); }
    inp.remove(); renderTabs();
  };
  inp.addEventListener("keydown", e => { if(e.key === "Enter") finish(true); if(e.key === "Escape") finish(false); e.stopPropagation(); });
  inp.addEventListener("blur", () => finish(true));
  inp.addEventListener("pointerdown", e => e.stopPropagation());
  tabEl.querySelector(".name").replaceWith(inp);
  inp.focus(); inp.select();
}
tabsEl.addEventListener("click", e => { const t = e.target.closest(".tab"); if(t && !e.target.closest("input")) selectTab(t.dataset.id); });
tabsEl.addEventListener("dblclick", e => { const t = e.target.closest(".tab"); if(t && !e.target.closest(".x")) renameTab(t.dataset.id); });
tabsEl.addEventListener("wheel", e => { // 마우스 휠을 굴리면 탭 줄이 좌우로 움직인다
  if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ tabsEl.scrollLeft += e.deltaY; e.preventDefault(); }
}, {passive: false});

// ---------- 끌어서 옮기기 (마우스와 손가락 모두) ----------
function sortable({box, item, handle, axis, longPress, onTab, onEnd}){
  let suppressClick = false;
  box.addEventListener("click", e => { if(suppressClick){ e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);
  box.addEventListener("pointerdown", e => {
    const h = e.target.closest(handle);
    if(!h || !box.contains(h) || e.button !== 0 || e.target.closest("input,textarea,.x")) return;
    const it = h.closest(item); if(!it) return;
    const touch = e.pointerType !== "mouse", pid = e.pointerId;
    let started = false, ghost = null, x = e.clientX, y = e.clientY, timer = null, raf = 0, tabHover = null;
    const r0 = it.getBoundingClientRect(), offX = x - r0.left, offY = y - r0.top;
    const block = ev => ev.preventDefault();
    const begin = () => {
      started = true;
      ghost = it.cloneNode(true); ghost.classList.add("ghost"); ghost.style.width = r0.width + "px";
      if(ghost.offsetHeight > 240 || r0.height > 240){ ghost.style.height = "160px"; ghost.style.overflow = "hidden"; }
      document.body.append(ghost); it.classList.add("dragging");
      document.addEventListener("touchmove", block, {passive: false});
      navigator.vibrate?.(15);
      place(); tick();
    };
    const place = () => {
      ghost.style.transform = `translate(${x - offX}px,${y - Math.min(offY, 60)}px)`;
      const under = document.elementFromPoint(x, y);
      const tabEl = onTab && under?.closest(".tab");
      tabHover?.classList.remove("drop"); tabHover = null;
      if(tabEl && tabEl.dataset.id !== curTab().id){ tabHover = tabEl; tabEl.classList.add("drop"); return; }
      const sib = under?.closest(item);
      if(sib && sib !== it && box.contains(sib)){
        const r = sib.getBoundingClientRect();
        const before = axis === "x" ? x < r.left + r.width / 2 : y < r.top + r.height / 2;
        box.insertBefore(it, before ? sib : sib.nextSibling);
      }
    };
    const tick = () => { // 가장자리에 가까우면 저절로 넘어간다
      if(!started) return;
      if(axis === "x"){ const r = box.getBoundingClientRect(); if(x < r.left + 40) box.scrollLeft -= 12; else if(x > r.right - 40) box.scrollLeft += 12; }
      else { const top = $("#head").getBoundingClientRect().bottom; if(y < top + 30 && y > top) window.scrollBy(0, -14); else if(y > innerHeight - 60) window.scrollBy(0, 14); }
      place(); raf = requestAnimationFrame(tick);
    };
    const move = ev => {
      if(ev.pointerId !== pid) return;
      x = ev.clientX; y = ev.clientY;
      const d = Math.hypot(x - e.clientX, y - e.clientY);
      if(!started){
        if(touch && longPress){ if(d > 10) stop(false); return; }
        if(d > 5) begin(); else return;
      }
      ev.preventDefault();
    };
    const stop = commit => {
      clearTimeout(timer); cancelAnimationFrame(raf);
      document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", cancel); document.removeEventListener("keydown", esc, true);
      document.removeEventListener("touchmove", block);
      if(!started) return;
      suppressClick = true; setTimeout(() => suppressClick = false, 50);
      ghost.remove(); it.classList.remove("dragging"); tabHover?.classList.remove("drop");
      if(!commit){ render(); return; }
      if(tabHover) onEnd(it.dataset.id, {tab: tabHover.dataset.id});
      else onEnd(it.dataset.id, {index: [...box.querySelectorAll(item)].indexOf(it)});
    };
    const up = ev => { if(ev.pointerId === pid) stop(true); };
    const cancel = ev => { if(ev.pointerId === pid) stop(started); };
    const esc = ev => { if(ev.key === "Escape"){ ev.stopPropagation(); stop(false); } };
    if(touch && longPress) timer = setTimeout(begin, 350);
    document.addEventListener("pointermove", move, {passive: false});
    document.addEventListener("pointerup", up); document.addEventListener("pointercancel", cancel);
    document.addEventListener("keydown", esc, true);
  });
}
sortable({box: tabsEl, item: ".tab", handle: ".tab", axis: "x", longPress: true, onEnd: (id, {index}) => {
  const t = tabOf(id), i = data.tabs.indexOf(t);
  if(index === i || index < 0) return renderTabs();
  data.tabs.splice(i, 1); data.tabs.splice(index, 0, t);
  op({op: "tab_move", id, index}); renderTabs();
}});
sortable({box: cardsEl, item: ".card", handle: ".grip", axis: "y", onTab: true, onEnd: (id, {index, tab}) => {
  if(tab) return moveCard(id, tab);
  const [t, i] = findCard(id);
  if(index === i || index < 0) return renderCards();
  moveCard(id, t.id, index);
}});

// ---------- 찾기 (모든 탭) ----------
const search = {
  on: false, hits: [], cur: -1,
  open(){ this.on = true; $("#searchbar").classList.add("on"); $("#q").focus(); $("#q").select(); if($("#q").value) this.run(false); },
  close(focusHit){
    this.on = false; $("#searchbar").classList.remove("on"); $("#qsnip").classList.remove("on");
    document.querySelectorAll(".hit").forEach(x => x.classList.remove("hit"));
    document.querySelectorAll(".tab.found").forEach(x => x.classList.remove("found"));
    const h = this.hits[this.cur];
    if(focusHit && h && h.card){
      const f = cardsEl.querySelector(`[data-id="${h.card}"] ${h.field}`);
      if(f && !f.hidden){ f.focus({preventScroll: true}); f.setSelectionRange(h.pos, h.pos + $("#q").value.length); }
    }
  },
  run(jump){
    const q = $("#q").value.toLowerCase();
    this.hits = [];
    document.querySelectorAll(".tab.found").forEach(x => x.classList.remove("found"));
    if(q){
      for(const t of data.tabs){
        const tabHit = t.name.toLowerCase().includes(q);
        if(tabHit) tabsEl.querySelector(`[data-id="${t.id}"]`)?.classList.add("found");
        for(const c of t.cards){
          for(const [field, val] of [[".title", c.title || ""], [".text", c.text || ""], [".paths", (c.paths || []).join("\n")]]){
            const low = val.toLowerCase(); let p = low.indexOf(q);
            while(p >= 0){ this.hits.push({tab: t.id, card: c.id, field, pos: p, val}); p = low.indexOf(q, p + q.length); }
          }
        }
        if(tabHit && !t.cards.length) this.hits.push({tab: t.id, card: null, pos: 0, val: t.name});
      }
    }
    this.cur = Math.min(Math.max(this.cur, 0), this.hits.length - 1);
    if(jump) this.show(); else this.count();
  },
  count(){ $("#qcount").textContent = $("#q").value ? (this.hits.length ? `${this.cur + 1}/${this.hits.length}` : "없음") : ""; },
  step(d){
    if(!this.hits.length) return this.count();
    this.cur = (this.cur + d + this.hits.length) % this.hits.length; this.show();
  },
  show(){
    this.count();
    document.querySelectorAll(".card.hit").forEach(x => x.classList.remove("hit"));
    const h = this.hits[this.cur]; if(!h){ $("#qsnip").classList.remove("on"); return; }
    if(curTab().id !== h.tab) selectTab(h.tab);
    if(h.card){
      const c = cardsEl.querySelector(`[data-id="${h.card}"]`);
      if(c){
        c.classList.add("hit");
        const f = c.querySelector(h.field), r = (f && !f.hidden ? f : c).getBoundingClientRect();
        // 찾은 글자가 있는 줄 근처로 옮긴다
        const lineY = f && !f.hidden ? r.top + (h.val.slice(0, h.pos).split("\n").length - 1) * 28 : r.top;
        scrollTo(0, scrollY + lineY - innerHeight / 2);
      }
    }
    const n = $("#q").value.length, a = Math.max(0, h.pos - 30);
    const esc = s => s.replace(/[&<>]/g, m => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[m])).replace(/\n/g, " ");
    $("#qsnip").innerHTML = `<b>${esc(tabOf(h.tab).name)}</b> · ${a ? "..." : ""}${esc(h.val.slice(a, h.pos))}<mark>${esc(h.val.slice(h.pos, h.pos + n))}</mark>${esc(h.val.slice(h.pos + n, h.pos + n + 60))}`;
    $("#qsnip").classList.add("on");
  },
};
$("#q").addEventListener("input", () => { search.cur = 0; search.run(true); });
$("#q").addEventListener("keydown", e => {
  if(e.key === "Enter"){ e.preventDefault(); search.step(e.shiftKey ? -1 : 1); }
  if(e.key === "Escape"){ e.preventDefault(); search.close(true); }
});
$("#qnext").onclick = () => search.step(1);
$("#qprev").onclick = () => search.step(-1);
$("#qclose").onclick = () => search.close(false);
$("#searchBtn").onclick = () => search.on ? search.close(false) : search.open();
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f"){ e.preventDefault(); search.open(); }
  else if(e.key === "F3"){ e.preventDefault(); search.on ? search.step(e.shiftKey ? -1 : 1) : search.open(); }
  else if(e.key === "Escape"){ $("#viewer").classList.remove("on"); closeMenu(); }
});

// ---------- 작은 메뉴, 알림 ----------
let menuEl = null;
function closeMenu(){ menuEl?.remove(); menuEl = null; }
function popMenu(anchor, items){
  closeMenu();
  menuEl = el("div", {class: "menu"});
  for(const it of items){
    if(it === "sep") menuEl.append(el("div", {class: "sep"}));
    else if(typeof it === "string") menuEl.append(el("div", {class: "lbl"}, it.slice(4)));
    else menuEl.append(el("button", {onclick: () => { closeMenu(); it[1](); }}, it[0]));
  }
  document.body.append(menuEl);
  const r = anchor.getBoundingClientRect(), m = menuEl.getBoundingClientRect();
  menuEl.style.left = Math.max(8, Math.min(r.right - m.width, innerWidth - m.width - 8)) + "px";
  menuEl.style.top = (r.bottom + m.height + 8 > innerHeight ? Math.max(8, r.top - m.height - 4) : r.bottom + 4) + "px";
}
document.addEventListener("pointerdown", e => { if(menuEl && !menuEl.contains(e.target)) closeMenu(); }, true);
let toastTimer;
function toast(msg, btn, fn){
  $("#toastMsg").textContent = msg;
  const b = $("#toastBtn"); b.hidden = !btn; b.textContent = btn || ""; b.onclick = () => { $("#toast").classList.remove("on"); fn(); };
  $("#toast").classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("#toast").classList.remove("on"), btn ? 6000 : 3500);
}

// ---------- 메뉴 창 ----------
const fmt = b => b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.ceil(b / 1024) + " KB";
const TOKEN_URL = "https://github.com/settings/personal-access-tokens/new?name=PromptBoard&description=" +
  encodeURIComponent("프롬프트 보드 폰 연동") + "&expires_in=none&contents=write";
async function openDialog(){
  $("#dlg").showModal();
  renderTrash();
  if(!IS_PC){
    $("#syncBox").replaceChildren(el("p", {}, `이 폰은 인터넷 저장소(${cloud.repo})와 연결되어 있어요. PC 가 꺼져 있어도 여기서 쓴 내용은 저장되고, PC 를 켜면 그대로 나타나요.`),
      el("p", {}, "브라우저 메뉴의 '홈 화면에 추가'를 누르면 앱처럼 바로 열 수 있어요."),
      el("div", {class: "row"}, el("button", {onclick: () => { if(confirm("이 폰의 연결을 끊을까요? 다시 쓰려면 QR 을 다시 찍어야 해요.")){ localStorage.removeItem("pb_token"); location.reload(); } }}, "이 폰 연결 끊기")));
    return;
  }
  try{
    const info = await local.req("/api/info");
    const s = info.storage;
    $("#storageInfo").textContent = `내용 ${fmt(s.data)} · 이미지 ${s.images}개 ${fmt(s.imagesBytes)} · 백업 ${s.backups}개 ${fmt(s.backupsBytes)} · ${info.dataDir}`;
    $("#autostart").checked = info.autostart;
    renderSync(info.sync);
  }catch(e){ $("#syncBox").replaceChildren(el("p", {}, "정보를 불러오지 못했어요: " + e.message)); }
}
function renderSync(sy){
  const box = $("#syncBox");
  if(!sy){ box.replaceChildren(el("p", {}, "인터넷 연동 설정이 없어요.")); return; }
  const stateLine = el("p", {}, `인터넷 저장소 ${sy.repo}: ${sy.state}` + (sy.pending ? ` · 보낼 변경 ${sy.pending}개` : "") + (sy.error ? ` · ${sy.error}` : ""));
  if(sy.phoneToken){
    box.replaceChildren(stateLine,
      el("p", {}, "폰 카메라로 아래 QR 을 찍으면 연결돼요. 와이파이가 달라도, PC 가 꺼져 있어도 폰에서 쓸 수 있어요. 열린 화면에서 브라우저 메뉴의 '홈 화면에 추가'를 누르면 다음부터 앱처럼 열려요."),
      el("div", {id: "qr"}),
      el("p", {}, "이 QR 에는 연결 열쇠가 들어 있어요. 다른 사람에게 보여 주지 마세요."));
    drawQr(sy.qr);
    return;
  }
  const inp = el("input", {type: "password", placeholder: "github_pat_ 로 시작하는 토큰 붙여넣기"});
  box.replaceChildren(stateLine,
    el("p", {}, "폰을 연결하려면 처음 한 번, 폰 전용 연결 열쇠(토큰)를 만들어야 해요."),
    el("ol", {},
      el("li", {}, "아래 [토큰 만들기 열기]를 누르세요 (GitHub 사이트가 열려요)."),
      el("li", {}, `Repository access 에서 'Only select repositories' 를 고르고 ${sy.repo.split("/")[1]} 를 선택하세요.`),
      el("li", {}, "Permissions 에서 Contents 가 'Read and write' 인지 확인하고, 맨 아래 [Generate token] 을 누르세요."),
      el("li", {}, "나온 토큰을 복사해 아래 칸에 붙여넣고 [저장] 을 누르세요.")),
    el("div", {class: "row"}, el("button", {onclick: () => local.req("/api/openurl", {url: TOKEN_URL})}, "토큰 만들기 열기")),
    el("div", {class: "row"}, inp, el("button", {onclick: async () => {
      try{ const r = await local.req("/api/sync/token", {token: inp.value}); renderSync(r.sync); toast("연결 열쇠를 저장했어요"); }
      catch(e){ toast(e.message); }
    }}, "저장")));
}
function drawQr(url){
  const go = () => { try{ new QRCode($("#qr"), {text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.L}); }catch{} };
  if(window.QRCode) return go();
  const s = el("script", {src: "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"});
  s.onload = go; s.onerror = () => $("#qr")?.replaceWith(el("p", {}, "QR 코드를 그리지 못했어요. 인터넷 연결을 확인해 주세요."));
  document.head.append(s);
}
function renderTrash(){
  const list = data?.trash || [];
  $("#trashList").replaceChildren(...(list.length ? list.map(e => el("div", {class: "trash-item"},
    el("span", {}, e.kind === "tab" ? `[탭] ${e.tab?.name} (칸 ${e.tab?.cards?.length || 0}개)` : `[칸] ${e.card?.title || (e.card?.text || "").slice(0, 60) || "(빈 칸)"}  · ${e.tabName || ""}`),
    el("small", {}, new Date(e.at).toLocaleDateString()),
    el("button", {onclick: () => { op({op: "restore", id: e.id}); applyOps(data, [{op: "restore", id: e.id}]); render(); renderTrash(); toast("되살렸어요"); }}, "되살리기")))
    : [el("p", {}, "비어 있어요.")]));
}
$("#emptyTrash").onclick = () => {
  if(!(data.trash || []).length) return toast("휴지통이 비어 있어요");
  if(!confirm("휴지통을 비울까요? 지운 칸과 탭이 완전히 지워지고 되살릴 수 없어요.")) return;
  op({op: "trash_empty"}); data.trash = []; renderTrash();
};
$("#openFolder").onclick = () => local.req("/api/openfolder", {});
$("#autostart").onchange = async e => {
  try{ const r = await local.req("/api/autostart", {on: e.target.checked}); e.target.checked = r.autostart; toast(r.autostart ? "컴퓨터를 켜면 자동으로 켜져요" : "자동 실행을 껐어요"); }
  catch(err){ toast("바꾸지 못했어요: " + err.message); }
};
$("#quitApp").onclick = async () => {
  if(outbox.length) await flush();
  if(!confirm("프로그램을 완전히 끌까요? 끈 동안 폰에서 쓴 내용은 다음에 켤 때 받아와요.")) return;
  await local.req("/api/quit", {}).catch(() => {}); window.close();
};
$("#dlgClose").onclick = () => $("#dlg").close();
$("#menuBtn").onclick = openDialog;
$("#addTab").onclick = addTab;
$("#addCard").onclick = () => addCard();
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => cardsEl.querySelectorAll(".text").forEach(grow), 150); });
addEventListener("beforeunload", e => { if(outbox.length){ flush(); e.preventDefault(); } });
document.addEventListener("visibilitychange", () => { if(!document.hidden && !IS_PC && outbox.length) flush(); });

// 폰: QR 로 받은 연결 정보(#r=저장소&t=토큰)를 이 폰에만 보관하고 주소창에서 지운다
if(!IS_PC){
  const h = new URLSearchParams(location.hash.slice(1));
  if(h.get("t") && h.get("r")){ cloud.repo = h.get("r"); cloud.token = h.get("t"); keep("pb_repo", cloud.repo); keep("pb_token", cloud.token); }
  if(location.hash) history.replaceState(null, "", location.pathname);
  for(const e of document.querySelectorAll(".pc-only")) e.hidden = true;
}
if(!IS_PC && !cloud.token) $("#setup").classList.add("on");
else poll();
</script>
